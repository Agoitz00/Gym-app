<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#c8a96e;--gold-l:#e4cfa0;--bg:#0f0e0c;--bg2:#1a1815;--bg3:#252320;--text:#f0ead8;--muted:#8a8070;--border:#2e2b26;--red:#e05555;--green:#4caf6e;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(1rem,calc(1rem + var(--sat,0px))) 1rem max(1rem,calc(1rem + var(--sab,0px)));touch-action:manipulation;}
.login-card{padding-bottom:max(2.5rem,calc(2.5rem + var(--sab,0px)));background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:340px;text-align:center}
.logo{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold);margin-bottom:.3rem}
.sub{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:2rem}
.pin-display{
  display:flex;justify-content:center;gap:.75rem;margin-bottom:1.75rem;height:20px;align-items:center;
}
.pin-dot{
  width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;
  transition:all .2s;
}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-dot.error{background:var(--red);border-color:var(--red);animation:shake .3s ease}
.pin-dot.ok{background:var(--green);border-color:var(--green)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.25rem}
.nbtn{min-height:52px;
  padding:1.1rem;border-radius:10px;border:1px solid var(--border);background:var(--bg3);
  color:var(--text);font-size:1.4rem;font-weight:700;cursor:pointer;transition:all .15s;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.nbtn:hover{background:var(--bg);border-color:var(--gold-l)}
.nbtn:active{transform:scale(.93);background:rgba(200,169,110,.15);border-color:var(--gold)}
.nbtn.del{color:var(--muted);font-size:1.1rem}
.nbtn.zero{grid-column:2/3}
.err-msg{font-size:.82rem;color:var(--red);min-height:1.2em;margin-bottom:.5rem;font-weight:700}
.hint{font-size:.72rem;color:var(--muted);margin-top:1.25rem;line-height:1.5}
.hint a{color:var(--gold);text-decoration:none}
.hint a:hover{text-decoration:underline}

  /* ── iOS / Safe Area ── */
  :root{
    --sat: env(safe-area-inset-top,0px);
    --sab: env(safe-area-inset-bottom,0px);
    --sal: env(safe-area-inset-left,0px);
    --sar: env(safe-area-inset-right,0px);
  }
  html{ -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  body{ -webkit-touch-callout:none; touch-action:manipulation; }
  /* Todos los inputs ≥16px para evitar auto-zoom en iOS */
  input,select,textarea{ font-size:max(16px,.86rem)!important; }
  /* Targets táctiles ≥44px (Apple HIG) */
  .btn,.cat-pill,.np-btn,.nbtn,.cbtn,.topbtn,.hbtn,.nav-item,.cam-btn,
  .zona-tab,.fbtn,.tick,.mesa-card,.prod-card,.kds-item{ min-height:44px; }
  /* GPU layers para animaciones suaves */
  .mesa-card,.prod-card,.kds-item,.cmd-card{ will-change:transform; transform:translateZ(0); }
  /* Scroll inercial */
  .prod-grid,#board,.order-items,.content{ -webkit-overflow-scrolling:touch; }
  /* Evitar flash blanco */
  html,body{ background-color:#0f0e0c; }

  .nbtn:active{transform:scale(.92);background:rgba(200,169,110,.18);border-color:var(--gold);}
  .pin-dot.filled{box-shadow:0 0 8px rgba(200,169,110,.4);}
</style>

  <!-- PWA + iOS -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TPV">
  <meta name="theme-color" content="#0f0e0c">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
</head>
<body>
<div class="login-card">
  <div class="logo" id="brandName">TPV</div>
  <div class="sub">Panel de administración</div>

  <div class="pin-display" id="pinDisplay">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
    <div class="pin-dot" id="d4"></div>
    <div class="pin-dot" id="d5"></div>
  </div>

  <div class="numpad">
    <button class="nbtn" onclick="np('1')">1</button>
    <button class="nbtn" onclick="np('2')">2</button>
    <button class="nbtn" onclick="np('3')">3</button>
    <button class="nbtn" onclick="np('4')">4</button>
    <button class="nbtn" onclick="np('5')">5</button>
    <button class="nbtn" onclick="np('6')">6</button>
    <button class="nbtn" onclick="np('7')">7</button>
    <button class="nbtn" onclick="np('8')">8</button>
    <button class="nbtn" onclick="np('9')">9</button>
    <button class="nbtn del" onclick="np('del')">⌫</button>
    <button class="nbtn zero" onclick="np('0')">0</button>
  </div>

  <div class="err-msg" id="errMsg"></div>
  <div class="hint">PIN por defecto: <b>1234</b><br>Cámbialo en Admin → Configuración<br><a href="/tpv">← Volver al TPV</a></div>
</div>

<script>
let pin = '', maxLen = 6, submitting = false;

async function init() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (cfg.nombre_local) document.getElementById('brandName').textContent = cfg.nombre_local;
  } catch {}
}

function updateDots(state) {
  for (let i = 0; i < 6; i++) {
    const d = document.getElementById('d' + i);
    d.className = 'pin-dot';
    if (i < pin.length) d.classList.add(state || 'filled');
  }
}

function np(v) {
  if (submitting) return;
  if (v === 'del') {
    pin = pin.slice(0, -1);
    document.getElementById('errMsg').textContent = '';
    updateDots();
    return;
  }
  if (pin.length >= maxLen) return;
  pin += v;
  updateDots();
  if (pin.length >= 4) setTimeout(tryLogin, 150);
}

async function tryLogin() {
  if (submitting || pin.length < 4) return;
  submitting = true;
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const data = await r.json();
    if (r.ok && data.token) {
      updateDots('ok');
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminTokenExp', data.expires);
      setTimeout(() => { window.location.href = '/admin'; }, 300);
    } else {
      updateDots('error');
      document.getElementById('errMsg').textContent = data.error || 'PIN incorrecto';
      setTimeout(() => { pin = ''; submitting = false; updateDots(); }, 800);
    }
  } catch (e) {
    document.getElementById('errMsg').textContent = e?.name==='TypeError' ? '⚠ Sin conexión con el servidor' : 'Error de conexión';
    pin = ''; submitting = false; updateDots();
  }
}

// Teclado físico también funciona
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') np(e.key);
  else if (e.key === 'Backspace') np('del');
  else if (e.key === 'Enter' && pin.length >= 4) tryLogin();
});

// Verificar si ya tiene sesión válida
async function checkExisting() {
  const token = localStorage.getItem('adminToken');
  const exp   = parseInt(localStorage.getItem('adminTokenExp') || '0');
  if (token && Date.now() < exp) {
    const r = await fetch('/api/auth/check', { headers: { 'x-admin-token': token } }).catch(() => null);
    if (r?.ok) {
      const d = await r.json();
      if (d.valid) { window.location.href = '/admin'; return; }
    }
  }
  localStorage.removeItem('adminToken');
  localStorage.removeItem('adminTokenExp');
}

checkExisting();
init();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js')
    .then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller) nw.postMessage('skipWaiting');
        });
      });
    }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
window._haptic=(t='light')=>{ if(navigator.vibrate) navigator.vibrate({light:10,medium:20,heavy:50}[t]||10); };
</script>
</body>
</html>
