<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agoitz Gym — Biblioteca de ejercicios</title>
<meta name="description" content="1.324 ejercicios de gimnasio con animación, instrucciones y filtros por grupo muscular y equipo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Big+Shoulders+Stencil+Display:wght@700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">45</span>
      <div class="brand-text">
        <h1 class="brand-title">Agoitz Gym</h1>
        <p class="brand-sub" data-i18n="tagline">Biblioteca de ejercicios</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Cambiar idioma">ES</button>
      <button class="routine-btn" id="routineBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8v8M8 5v14M16 5v14M20 8v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span data-i18n="myRoutine">Mi rutina</span>
        <span class="routine-count" id="routineCount">0</span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="filter-bar" aria-label="Filtros">
    <div class="search-row">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Buscar ejercicio, músculo…" autocomplete="off">
      <select id="equipmentSelect" aria-label="Equipo">
        <option value="" data-i18n="allEquipment">Todo el equipo</option>
      </select>
    </div>
    <div class="plate-rack" id="plateRack" role="group" aria-label="Filtrar por parte del cuerpo"></div>
  </section>

  <div class="result-row">
    <span class="result-count" id="resultCount"></span>
    <button type="button" class="clear-all-chip" id="clearAllChip" hidden data-i18n="emptyReset">Quitar filtros</button>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>

  <div class="empty-state" id="emptyState" hidden>
    <span class="empty-plate">0</span>
    <p data-i18n="emptyTitle">No hay ejercicios con esos filtros.</p>
    <button id="resetFilters" data-i18n="emptyReset" type="button">Quitar filtros</button>
  </div>

  <div class="sentinel" id="sentinel" aria-hidden="true"></div>
</main>

<!-- Modal de detalle -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="Cerrar">✕</button>
    <div class="modal-media">
      <img id="modalGif" alt="">
    </div>
    <div class="modal-body">
      <span class="modal-chip" id="modalChip"></span>
      <h2 id="modalTitle"></h2>
      <div class="modal-meta">
        <div><span data-i18n="labelTarget">Músculo objetivo</span><strong id="modalTarget"></strong></div>
        <div><span data-i18n="labelEquipment">Equipo</span><strong id="modalEquipment"></strong></div>
        <div><span data-i18n="labelSecondary">Músculos secundarios</span><strong id="modalSecondary"></strong></div>
      </div>
      <h3 data-i18n="labelSteps">Cómo se hace</h3>
      <ol id="modalSteps"></ol>

      <div class="add-block">
        <button class="add-routine-btn" id="modalAddBtn" type="button">
          <span data-i18n="addToRoutine">Añadir a mi rutina</span>
        </button>
        <div class="day-picker" id="modalDayPicker" hidden></div>
      </div>

      <div class="alt-section">
        <button class="alt-toggle" id="altToggle" type="button">
          <span data-i18n="altToggle">¿Ocupado? Ver alternativas</span>
        </button>
        <div class="alt-list" id="altList" hidden></div>
      </div>
    </div>
  </div>
</div>

<!-- Panel de rutina -->
<div class="routine-backdrop" id="routineBackdrop" hidden>
  <aside class="routine-panel" role="dialog" aria-modal="true" aria-labelledby="routineTitle">
    <div class="routine-head">
      <h2 id="routineTitle" data-i18n="myRoutine">Mi rutina</h2>
      <button class="modal-close" id="routineClose" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="routine-io">
      <button type="button" id="exportBtn" class="io-btn" data-i18n="exportBtn">⬇ Exportar</button>
      <button type="button" id="importBtn" class="io-btn" data-i18n="importBtn">⬆ Importar</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div class="routine-days" id="routineDays"></div>
    <p class="routine-empty" id="routineEmpty" data-i18n="routineEmpty">Aún no has añadido ejercicios.</p>
    <form class="add-day-form" id="addDayForm">
      <input type="text" id="addDayInput" data-i18n-placeholder="addDayPlaceholder" placeholder="Nuevo día (ej. Piernas)">
      <button type="submit" data-i18n="addDayBtn">+ Añadir</button>
    </form>
  </aside>
</div>

<footer class="site-footer">
  <p><span data-i18n="footerData">Datos de ejercicios</span>: <a href="https://github.com/hasaneyldrm/exercises-dataset" target="_blank" rel="noopener">exercises-dataset</a> (MIT) · <span data-i18n="footerMedia">Imágenes y animaciones</span> © <a href="https://gymvisual.com/" target="_blank" rel="noopener">Gym visual</a></p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
